apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: bank-aggregator
  description: Agrega los conectores de los bancos socios y expone una API unificada de saldos y transferencias
  tags: [nodejs, rest, open-banking]
spec:
  type: service
  lifecycle: production
  owner: banking-integrations-team
  system: banking-integration
  providesApis: [bank-aggregator-api]
  dependsOn:
    - component:bank-connector-alfa
    - component:bank-connector-meridiano
    - component:bank-connector-vertice
