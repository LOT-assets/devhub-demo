apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: bank-aggregator-api
  description: >-
    API unificada que abstrae las diferencias entre los conectores bancarios
    (transferencias, saldos, estados de cuenta) detrás de un único contrato
  tags: [rest, open-banking]
spec:
  type: openapi
  lifecycle: production
  owner: banking-integrations-team
  system: banking-integration
  definition: |
    openapi: 3.0.0
    info:
      title: Bank Aggregator API
      version: 1.0.0
    paths:
      /accounts/{accountId}/balance:
        get:
          summary: Consulta el saldo de una cuenta en el banco origen
          responses:
            '200':
              description: OK
      /transfers:
        post:
          summary: Ejecuta una transferencia hacia o desde un banco socio
          responses:
            '202':
              description: Accepted
