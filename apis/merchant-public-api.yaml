apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: merchant-public-api
  description: API pública expuesta a pymes y comercios para integrarse con FinBridge (cobros, pagos y financiamiento)
  tags: [rest, public, merchant]
spec:
  type: openapi
  lifecycle: production
  owner: fintech-core-team
  system: payments-platform
  definition: |
    openapi: 3.0.0
    info:
      title: Merchant Public API
      version: 1.0.0
    paths:
      /v1/charges:
        post:
          summary: Crea un cobro para un comercio
          responses:
            '201':
              description: Created
      /v1/payouts:
        post:
          summary: Solicita un pago/desembolso hacia la cuenta del comercio
          responses:
            '202':
              description: Accepted
      /v1/financing/offers:
        get:
          summary: Lista ofertas de financiamiento disponibles para el comercio
          responses:
            '200':
              description: OK
